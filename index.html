<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras Digitales - Colegio Winston</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      max-width: 700px;
      width: 100%;
    }
    h1 {
      color: #2b580c;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      color: #4a7c59;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }
    .grid-juegos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .btn-juego {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f0fdf4;
      border: 4px solid #4ade80;
      border-radius: 20px;
      padding: 20px;
      text-decoration: none;
      color: #166534;
      font-weight: 700;
      font-size: 1.3rem;
      transition: all 0.3s ease;
    }
    .btn-juego:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 12px 20px rgba(74, 222, 128, 0.4);
      background: #dcfce7;
    }
    .btn-juego .emoji {
      font-size: 4rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🦉 Aventuras Digitales Winston</h1>
    <p>¡Hola! Elige la actividad que quieres practicar hoy:</p>

    <div class="grid-juegos">
      <a href="aprende_a_iniciar_sesi_n_winston.html" class="btn-juego" id="btn-correo">
        <span class="emoji">⌨️📧</span>
        <span>Aprende tu Teclado y Correo</span>
      </a>

      <a href="mouse_app.html" class="btn-juego" id="btn-mouse">
        <span class="emoji">🖱️🎒</span>
        <span>Entrena tu Mouse y Mochila</span>
      </a>
    </div>
  </div>

</body>
</html>
